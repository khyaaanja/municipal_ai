:root{--field:#07070C;--cream:#F6F1E9;--stone:#A8A29E;--blue:#60A5FA;--purple:#A78BFA;
      --glow:rgba(99,102,241,.45);--red:#EF4444;--gold:#F59E0B;--bd:rgba(255,255,255,.12);}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--field);}
#root{width:100%;height:100%;position:relative;overflow:hidden;background:var(--field);
      font-family:"DM Sans",sans-serif;color:var(--cream);}
.deva{font-family:"Noto Deva",sans-serif;}
.scene{position:absolute;inset:0;overflow:hidden;}
.fill{position:absolute;inset:-8%;background-size:cover;background-position:center;
      filter:blur(42px) brightness(.34) saturate(1.15);}
.tint{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(99,102,241,.16) 0%,rgba(7,7,12,.55) 62%,rgba(7,7,12,.9) 100%);}
.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
.card{position:relative;border-radius:20px;overflow:hidden;background-size:cover;background-position:center;
      box-shadow:0 50px 120px rgba(0,0,0,.72),0 0 0 1px rgba(255,255,255,.10),0 0 90px rgba(99,102,241,.22);}
.cap{position:absolute;left:96px;bottom:82px;max-width:760px;text-align:left;}
.cap-k{font-size:23px;font-weight:500;letter-spacing:.32em;text-transform:uppercase;color:var(--blue);}
.cap-t{margin-top:16px;font-size:60px;font-weight:700;line-height:1.28;color:var(--cream);}
.cap-s{margin-top:16px;font-size:30px;font-weight:400;line-height:1.5;color:var(--stone);}
.rail{position:absolute;right:96px;top:50%;transform:translateY(-50%);width:430px;text-align:left;}
.chk{display:flex;align-items:center;gap:18px;margin-bottom:22px;font-size:31px;color:var(--cream);}
.chk i{width:38px;height:38px;border-radius:50%;flex:0 0 38px;display:flex;align-items:center;justify-content:center;
       background:rgba(96,165,250,.22);border:2px solid var(--blue);color:#BCDBFD;font-style:normal;font-size:21px;}
.wave{display:flex;align-items:flex-end;gap:7px;height:78px;margin-bottom:34px;}
.wave b{width:7px;border-radius:4px;background:linear-gradient(180deg,var(--purple),var(--blue));display:block;height:12px;}
.ref{font-family:"Syne",sans-serif;font-weight:800;font-size:66px;letter-spacing:.02em;
     background:linear-gradient(96deg,var(--blue),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent;}
.reflbl{margin-top:10px;font-size:22px;letter-spacing:.3em;text-transform:uppercase;color:var(--stone);}
.steps{display:flex;align-items:center;gap:16px;margin-top:30px;}
.step{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.14);position:relative;overflow:hidden;}
.step span{position:absolute;inset:0;background:linear-gradient(90deg,var(--blue),var(--purple));transform:scaleX(0);transform-origin:0 50%;display:block;}
.steplbl{display:flex;gap:16px;margin-top:14px;font-size:20px;color:var(--stone);}
.steplbl div{flex:1;}
.row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:19px 26px;margin-bottom:14px;
     background:rgba(15,16,26,.72);border:1px solid var(--bd);border-radius:14px;font-size:27px;}
.row em{font-style:normal;color:var(--stone);font-size:22px;}
.chip{display:inline-block;padding:13px 24px;margin:0 10px 12px 0;border-radius:9999px;font-size:24px;
      background:rgba(167,139,250,.16);border:2px solid rgba(167,139,250,.5);color:#C4B5FD;}
.ring{width:96px;height:96px;border-radius:50%;border:5px solid rgba(255,255,255,.14);position:relative;margin-bottom:26px;}
.ring i{position:absolute;inset:-5px;border-radius:50%;border:5px solid transparent;border-top-color:#34D399;border-right-color:#34D399;
        transform:rotate(-90deg);font-style:normal;}
/* hero */
#hero-img{position:absolute;top:50%;left:0;width:4454px;height:838px;margin-top:-419px;background-size:cover;background-position:left center;}
#hero-veil{position:absolute;inset:0;opacity:0;background:linear-gradient(90deg,rgba(7,7,12,.90) 0%,rgba(7,7,12,.55) 35%,rgba(7,7,12,.80) 100%);}
#hero-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
#h-tiles{display:flex;gap:18px;margin-bottom:54px;}
.tile{padding:18px 30px;border-radius:14px;background:rgba(15,16,26,.80);border:1px solid var(--bd);font-size:26px;}
#h-brand{font-family:"Syne",sans-serif;font-weight:800;font-size:132px;line-height:1;white-space:nowrap;}
#h-sub{margin-top:26px;font-size:34px;font-weight:500;color:#DDD6FE;}
#h-tag{margin-top:34px;font-size:52px;font-weight:700;
       background:linear-gradient(96deg,var(--red),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;}
#h-co{margin-top:44px;font-size:23px;letter-spacing:.34em;text-transform:uppercase;color:var(--stone);}
#letterbox-t,#letterbox-b{position:absolute;left:0;width:100%;height:58px;background:var(--field);z-index:50;}
#letterbox-t{top:0;} #letterbox-b{bottom:0;}
#chrome-l{position:absolute;left:54px;top:0;height:58px;display:flex;align-items:center;gap:20px;z-index:60;}
#ch-idx{font-family:"Syne",sans-serif;font-weight:700;font-size:19px;color:#99C5FC;letter-spacing:.14em;}
#ch-ttl{font-size:19px;font-weight:500;color:var(--stone);letter-spacing:.06em;}
#prog{position:absolute;left:54px;right:54px;bottom:27px;height:3px;background:rgba(255,255,255,.13);border-radius:2px;z-index:60;overflow:hidden;}
#prog-f{display:block;height:100%;width:100%;transform:scaleX(0);transform-origin:0 50%;
        background:linear-gradient(90deg,var(--blue),var(--purple));}
#bcard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
       background:radial-gradient(circle at 50% 42%,rgba(99,102,241,.16) 0%,rgba(7,7,12,1) 64%);}
#b-brand{font-family:"Syne",sans-serif;font-weight:800;font-size:138px;line-height:1;white-space:nowrap;}
#b-sub{margin-top:30px;font-size:36px;font-weight:500;color:#DDD6FE;}
#b-rule{margin-top:46px;width:240px;height:2px;background:var(--bd);}
#b-co{margin-top:34px;font-size:25px;letter-spacing:.20em;text-transform:uppercase;color:var(--stone);}
#b-co b{color:var(--cream);font-weight:700;letter-spacing:.14em;}
</style>
