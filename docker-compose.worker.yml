# ─────────────────────────────────────────────────────────────────────────────
# WORKER NODE — docker-compose.worker.yml
# Deploy this on Server 2, 3, etc.
# DB and Redis live on Server 1. This node runs only: web + celery.
#
# Usage on Server 2:
#   DB_HOST=<server1_ip> REDIS_URL=redis://<server1_ip>:6379/1 \
#   CELERY_BROKER_URL=redis://<server1_ip>:6379/0 \
#   docker-compose -f docker-compose.worker.yml up -d --scale web=3
# ─────────────────────────────────────────────────────────────────────────────
version: '3.9'

services:
  web:
    build: .
    restart: always
    env_file: .env
    environment:
      BEHIND_PROXY: "True"
    volumes:
      - ./media:/app/media
      - ./logs:/app/logs
      - static_files:/app/staticfiles
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Skip migrate/createcachetable — Server 1 handles DB init
    command: gunicorn municipal_ai.wsgi:application --config gunicorn.conf.py

  celery:
    build: .
    restart: always
    env_file: .env
    volumes:
      - ./media:/app/media
      - ./logs:/app/logs
    command: celery -A municipal_ai worker -l info --concurrency 8 -Q default,celery

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "8000:8000"       # LB connects to this port
      - "80:80"
    volumes:
      - ./nginx.worker.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
      - ./media:/app/media:ro
    depends_on:
      - web

volumes:
  static_files:
