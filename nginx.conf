# Docker DNS resolves 'web' to ALL replica IPs and round-robins automatically.
# Scale with: docker-compose up --scale web=3 -d
# No changes needed here when scaling replicas.
upstream django {
    server web:8000;
    keepalive 64;              # persistent connections per worker — increase with replicas
}

# Gzip compression — reduces transfer size ~70% for HTML/JSON
gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_comp_level 5;

# Nginx-level rate limiting (first line of defence before Django)
limit_req_zone $binary_remote_addr zone=api:10m     rate=60r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=300r/m;
limit_conn_zone $binary_remote_addr zone=conn:10m;

# Micro-cache for dynamic pages: 1-second cache kills thundering-herd
# on sudden traffic spikes (1000 users hit same URL at once → 1 DB query)
proxy_cache_path /tmp/nginx_cache
    levels=1:2
    keys_zone=micro:20m
    max_size=500m
    inactive=10m
    use_temp_path=off;

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name bhaktapur.gov.np www.bhaktapur.gov.np;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bhaktapur.gov.np www.bhaktapur.gov.np;

    ssl_certificate     /etc/ssl/bhaktapur/fullchain.pem;
    ssl_certificate_key /etc/ssl/bhaktapur/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header X-Frame-Options           "SAMEORIGIN"                                   always;
    add_header X-XSS-Protection          "1; mode=block"                                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy        "camera=(), microphone=(self), geolocation=()" always;

    client_max_body_size 10M;
    limit_conn conn 50;        # max 50 concurrent connections per IP

    # Static files — Nginx serves directly, zero Django overhead
    location /static/ {
        alias /app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        tcp_nodelay off;
        open_file_cache max=3000 inactive=120s;
        open_file_cache_valid 45s;
    }

    # Media files
    location /media/ {
        # Private uploads must never bypass Django authorization.
        return 404;
    }

    # Health check — no rate limit, no logging, no cache
    location /health/ {
        proxy_pass         http://django;
        proxy_set_header   Host $host;
        access_log         off;
        proxy_read_timeout 5s;
        proxy_cache        off;
    }

    # AI Chat streaming (SSE) — buffering MUST be off or stream breaks
    location /api/chat/stream/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass             http://django;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_http_version     1.1;
        proxy_set_header       Connection        "";
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     120s;
        chunked_transfer_encoding on;
    }

    # Async chat poll — lightweight, high-frequency, fast (Redis lookup only)
    location /api/chat/poll/ {
        limit_req zone=api burst=120 nodelay;  # polling is fast, allow bursts
        proxy_pass         http://django;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_read_timeout 5s;
        proxy_cache        off;
    }

    # All other API routes — rate-limited
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass         http://django;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_read_timeout 120s;
        proxy_cache        off;
    }

    # Everything else: Django + 1-second micro-cache (thundering-herd protection)
    location / {
        limit_req zone=general burst=50 nodelay;
        proxy_pass         http://django;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_redirect     off;
        proxy_read_timeout 60s;

        # 1-second micro-cache: protects DB on sudden traffic spikes
        # Skip cache for authenticated users, POST requests, admin
        proxy_cache            micro;
        proxy_cache_valid      200 1s;
        proxy_cache_use_stale  error timeout updating;
        proxy_cache_bypass     $http_authorization $cookie_sessionid;
        proxy_no_cache         $http_authorization $cookie_sessionid;
        proxy_cache_key        "$scheme$host$request_uri";
        add_header             X-Cache-Status $upstream_cache_status;
    }
}
