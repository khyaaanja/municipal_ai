# ─────────────────────────────────────────────────────────────────────────────
# MULTI-SERVER LOAD BALANCER — nginx.lb.conf
# Deploy this on a dedicated load-balancer VPS (cheapest tier works, ~$6/mo).
# Each backend server runs docker-compose.yml with 3 web replicas.
#
# To add a 3rd server: uncomment SERVER3 lines and add the IP.
# ─────────────────────────────────────────────────────────────────────────────

upstream django_cluster {
    least_conn;                        # route to server with fewest active connections

    server SERVER1_IP:8000 weight=1 max_fails=3 fail_timeout=30s;
    server SERVER2_IP:8000 weight=1 max_fails=3 fail_timeout=30s;
    # server SERVER3_IP:8000 weight=1 max_fails=3 fail_timeout=30s;

    keepalive 128;
}

# ── Rate limits ───────────────────────────────────────────────────────────────
limit_req_zone  $binary_remote_addr zone=api:20m     rate=60r/m;
limit_req_zone  $binary_remote_addr zone=general:20m rate=300r/m;
limit_conn_zone $binary_remote_addr zone=conn:20m;

# ── Micro-cache (thundering herd protection) ──────────────────────────────────
proxy_cache_path /tmp/nginx_lb_cache
    levels=1:2
    keys_zone=micro:50m
    max_size=2g
    inactive=10m
    use_temp_path=off;

# Gzip
gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_proxied any;
gzip_vary on;

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name bhaktapur.gov.np www.bhaktapur.gov.np;
    return 301 https://$host$request_uri;
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name bhaktapur.gov.np www.bhaktapur.gov.np;

    ssl_certificate     /etc/ssl/bhaktapur/fullchain.pem;
    ssl_certificate_key /etc/ssl/bhaktapur/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache   shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"   always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    client_max_body_size 10M;
    limit_conn conn 100;

    # Static/media: each backend serves its own staticfiles via Nginx.
    # For shared static across nodes, mount an NFS volume or use S3.
    # For now, proxy static to SERVER1 (they're identical since collectstatic).
    location /static/ {
        proxy_pass         http://SERVER1_IP:8000;
        proxy_cache        micro;
        proxy_cache_valid  200 24h;     # static files are immutable (hashed names)
        proxy_cache_use_stale error timeout updating;
        proxy_cache_key    "static$request_uri";
        add_header         X-Cache-Status $upstream_cache_status;
        expires            1y;
        add_header         Cache-Control "public, immutable";
        access_log         off;
    }

    location /media/ {
        proxy_pass         http://SERVER1_IP:8000;
        expires            7d;
        add_header         Cache-Control "public";
        access_log         off;
    }

    # Health checks — hit all backends
    location /health/ {
        proxy_pass         http://django_cluster;
        proxy_set_header   Host $host;
        access_log         off;
        proxy_read_timeout 5s;
        proxy_cache        off;
    }

    # SSE streaming — no buffering, no caching
    location /api/chat/stream/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass             http://django_cluster;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_http_version     1.1;
        proxy_set_header       Connection        "";
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     120s;
        chunked_transfer_encoding on;
    }

    # Async chat poll — very fast Redis lookup, high burst allowed
    location /api/chat/poll/ {
        limit_req zone=api burst=200 nodelay;
        proxy_pass         http://django_cluster;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_read_timeout 5s;
        proxy_cache        off;
    }

    # API routes
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass         http://django_cluster;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_read_timeout 120s;
        proxy_cache        off;
    }

    # All other requests — micro-cache + load balance
    location / {
        limit_req zone=general burst=100 nodelay;
        proxy_pass         http://django_cluster;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_redirect     off;
        proxy_read_timeout 60s;

        proxy_cache            micro;
        proxy_cache_valid      200 1s;
        proxy_cache_use_stale  error timeout updating;
        proxy_cache_bypass     $http_authorization $cookie_sessionid;
        proxy_no_cache         $http_authorization $cookie_sessionid;
        proxy_cache_key        "$scheme$host$request_uri";
        add_header             X-Cache-Status $upstream_cache_status;
    }
}
