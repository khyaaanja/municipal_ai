# Nginx config for worker nodes — sits between LB and gunicorn replicas
upstream django {
    server web:8000;
    keepalive 64;
}

gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_proxied any;
gzip_vary on;

proxy_cache_path /tmp/nginx_worker_cache
    levels=1:2
    keys_zone=micro:20m
    max_size=500m
    inactive=5m
    use_temp_path=off;

limit_req_zone  $binary_remote_addr zone=api:10m     rate=60r/m;
limit_req_zone  $binary_remote_addr zone=general:10m rate=300r/m;
limit_conn_zone $binary_remote_addr zone=conn:10m;

server {
    listen 8000;      # LB connects here
    listen 80;

    client_max_body_size 10M;
    limit_conn conn 200;

    location /static/ {
        alias /app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        open_file_cache max=3000 inactive=120s;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /health/ {
        proxy_pass         http://django;
        proxy_set_header   Host $host;
        access_log         off;
        proxy_read_timeout 5s;
        proxy_cache        off;
    }

    location /api/chat/stream/ {
        proxy_pass             http://django;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_http_version     1.1;
        proxy_set_header       Connection        "";
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     120s;
        chunked_transfer_encoding on;
    }

    location /api/chat/poll/ {
        proxy_pass         http://django;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_read_timeout 5s;
        proxy_cache        off;
    }

    location /api/ {
        proxy_pass         http://django;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_read_timeout 120s;
        proxy_cache        off;
    }

    location / {
        proxy_pass         http://django;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_redirect     off;
        proxy_read_timeout 60s;

        proxy_cache            micro;
        proxy_cache_valid      200 1s;
        proxy_cache_use_stale  error timeout updating;
        proxy_cache_bypass     $http_authorization $cookie_sessionid;
        proxy_no_cache         $http_authorization $cookie_sessionid;
        proxy_cache_key        "$scheme$host$request_uri";
    }
}
