<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Server Error — Bhaktapur Municipal Platform</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'DM Sans',system-ui,sans-serif;background:#F5F0E8;color:#0D0D0D;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center;}
    .code{font-size:7rem;font-weight:900;color:rgba(193,59,42,.12);line-height:1;font-family:'Syne',sans-serif;letter-spacing:-.04em;}
    h1{font-size:1.8rem;margin:8px 0 12px;font-family:'Syne',sans-serif;}
    p{color:#8A7F72;max-width:440px;line-height:1.7;margin-bottom:28px;}
    .links{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
    a.btn{display:inline-block;padding:11px 24px;border-radius:4px;font-weight:700;font-size:.9rem;text-decoration:none;transition:opacity .15s;}
    .btn-red{background:#C13B2A;color:#fff;} .btn-red:hover{opacity:.88;}
    .btn-out{background:transparent;border:1.5px solid #0D0D0D;color:#0D0D0D;} .btn-out:hover{background:#0D0D0D;color:#F5F0E8;}
    .brand{margin-top:48px;font-size:.8rem;color:#C4BCB0;}
  </style>
</head>
<body>
  <div class="code">500</div>
  <h1>Something went wrong</h1>
  <p>Our servers encountered an unexpected error. Our team has been notified and is working on it. Please try again in a moment.</p>
  <div class="links">
    <a href="/" class="btn btn-red">Go Home</a>
    <a href="/complaint/" class="btn btn-out">Report an Issue</a>
    <a href="/chat/" class="btn btn-out">Ask AI</a>
  </div>
  <div class="brand">Bhaktapur Municipal AI Platform</div>
</body>
</html>
