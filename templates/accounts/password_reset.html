{% extends "accounts/base_auth.html" %}
{% block title %}Forgot Password — {{ CITY_NAME }}{% endblock %}
{% block form_content %}

<h1 class="auth-heading">Forgot password?</h1>
<p class="auth-sub">Enter your email and we'll send a reset link.</p>

<form method="post">
  {% csrf_token %}
  <div class="form-group">
    <label class="form-label" for="email">Email Address</label>
    <div class="input-wrap">
      <input type="email" name="email" id="email" placeholder="you@example.com" required autofocus>
    </div>
  </div>
  <button type="submit" class="btn-submit">Send Reset Link</button>
</form>

<div class="auth-links" style="margin-top:16px;">
  <a href="{% url 'accounts:login' %}">&larr; Back to Login</a>
</div>

{% endblock %}
