{% extends "base/base.html" %}
{% block title %}Forgot Password — {{ CITY_NAME }}{% endblock %}
{% block content %}
<div style="min-height:70vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;">
  <div style="background:#fff;border:1px solid rgba(13,13,13,.1);border-radius:8px;padding:40px;width:100%;max-width:420px;box-shadow:0 4px 24px rgba(13,13,13,.08);">
    <div style="text-align:center;margin-bottom:28px;">
      <div style="font-size:2.5rem;margin-bottom:12px;">🔑</div>
      <h1 style="font-size:1.6rem;margin-bottom:8px;">Forgot your password?</h1>
      <p style="color:var(--stone);font-size:.9rem;">Enter your email and we'll send a reset link.</p>
    </div>
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="you@example.com" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px;">Send Reset Link</button>
    </form>
    <div style="text-align:center;margin-top:20px;font-size:.85rem;color:var(--stone);">
      <a href="/login/" style="color:var(--red);">← Back to Login</a>
    </div>
  </div>
</div>
{% endblock %}
