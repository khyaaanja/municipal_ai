{% extends "base/base.html" %}
{% block title %}Password Reset Complete — {{ CITY_NAME }}{% endblock %}
{% block content %}
<div style="min-height:70vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;">
  <div style="background:#fff;border:1px solid rgba(13,13,13,.1);border-radius:8px;padding:40px;width:100%;max-width:440px;text-align:center;">
    <div style="font-size:3rem;margin-bottom:16px;">✅</div>
    <h1 style="font-size:1.6rem;margin-bottom:12px;">Password updated!</h1>
    <p style="color:var(--stone);line-height:1.7;margin-bottom:28px;">
      Your password has been changed successfully. You can now log in with your new password.
    </p>
    <a href="/login/" class="btn btn-primary btn-block">Login Now →</a>
  </div>
</div>
{% endblock %}
