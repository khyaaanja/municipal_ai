{% extends "chairperson/base.html" %}
{% block chair_content %}
<div class="chair-page-header">
  <h1 class="chair-page-title">Create Ward Meeting</h1>
  <a href="/civic/manage/meetings/" class="chair-btn chair-btn-outline">← Back</a>
</div>
<div class="chair-card">
  <div class="chair-card-head">Meeting Details</div>
  <div style="padding:24px">
    {% if messages %}{% for m in messages %}<div style="background:{% if 'error' in m.tags %}#fee2e2{% else %}#dcfce7{% endif %};border-radius:6px;padding:12px 16px;margin-bottom:16px;font-size:.88rem;">{{ m }}</div>{% endfor %}{% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label>Meeting Title <span style="color:var(--red)">*</span></label>
        <input type="text" name="title" required maxlength="200" placeholder="e.g. Monthly Ward Meeting" style="width:100%;padding:9px 12px;border:1px solid #d5cfc6;border-radius:4px;font-size:.9rem;font-family:var(--font-body);color:var(--ink);background:#fff;outline:none;box-sizing:border-box">
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea name="description" rows="3" placeholder="Brief summary of the meeting..."></textarea>
      </div>
      <div class="form-group">
        <label>Venue <span style="color:var(--red)">*</span></label>
        <input type="text" name="venue" required maxlength="300" placeholder="Location or online link" style="width:100%;padding:9px 12px;border:1px solid #d5cfc6;border-radius:4px;font-size:.9rem;font-family:var(--font-body);color:var(--ink);background:#fff;outline:none;box-sizing:border-box">
      </div>
      <div class="form-group">
        <label>Date & Time <span style="color:var(--red)">*</span></label>
        <input type="datetime-local" name="meeting_date" required style="width:100%;padding:9px 12px;border:1px solid #d5cfc6;border-radius:4px;font-size:.9rem;font-family:var(--font-body);color:var(--ink);background:#fff;outline:none;box-sizing:border-box">
      </div>
      <div class="form-group">
        <label>Agenda</label>
        <textarea name="agenda" rows="4" placeholder="One item per line..."></textarea>
      </div>
      <div class="form-group">
        <label>Maximum RSVPs (optional)</label>
        <input type="number" name="max_rsvp" min="1" placeholder="Leave blank for unlimited" style="width:100%;padding:9px 12px;border:1px solid #d5cfc6;border-radius:4px;font-size:.9rem;font-family:var(--font-body);color:var(--ink);background:#fff;outline:none;box-sizing:border-box">
      </div>
      <button type="submit" class="chair-btn chair-btn-green">Create Meeting</button>
    </form>
  </div>
</div>
{% endblock %}
