<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Complaint — Bhaktapur Municipal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#060810;--gold:#c9a84c;--red:#C1440E;--surface:#111009;--card:#1A1710;
      --border:rgba(201,168,76,0.18);--text:#E8DFC8;--muted:#7A7060;--font-h:'Cinzel',serif;--font-b:'Inter',sans-serif;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:var(--font-b);min-height:100vh;
      display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1rem;
      position:relative;overflow:hidden;}
    #particles-js{position:fixed;inset:0;z-index:0;}
    .card{position:relative;z-index:1;background:var(--card);border:1px solid var(--border);
      border-radius:14px;padding:2.5rem 2rem;width:100%;max-width:480px;will-change:transform;}
    h1{font-family:var(--font-h);font-size:1.6rem;color:var(--gold);margin-bottom:0.4rem;letter-spacing:0.04em;}
    p{color:var(--muted);font-size:0.875rem;margin-bottom:1.75rem;}
    .form-group{position:relative;margin-bottom:1rem;}
    .form-group input{
      width:100%;background:var(--surface);border:1px solid var(--border);border-radius:6px;
      padding:1rem 1rem 0.5rem;font-size:1rem;color:var(--text);font-family:var(--font-b);
      outline:none;transition:border-color 0.3s,box-shadow 0.3s;min-height:44px;letter-spacing:0.05em;}
    .form-group input:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,168,76,0.2);}
    .form-group input.error-input{border-color:var(--red);}
    .form-group label{position:absolute;left:1rem;top:50%;transform:translateY(-50%);
      font-size:0.9rem;color:var(--muted);pointer-events:none;transition:top 0.2s,font-size 0.2s,color 0.2s;}
    .form-group input:focus ~ label,.form-group input:not(:placeholder-shown) ~ label{top:0.45rem;font-size:0.72rem;color:var(--gold);}
    .error-msg{color:var(--red);font-size:0.82rem;margin-top:0.4rem;margin-bottom:0.5rem;}
    .btn-track{
      width:100%;padding:0.9rem;background:linear-gradient(135deg,#c9a84c,#a07830);
      color:#060810;font-family:var(--font-h);font-size:0.95rem;font-weight:700;
      border:none;border-radius:6px;cursor:pointer;position:relative;overflow:hidden;
      transition:box-shadow 0.3s;min-height:44px;}
    .btn-track:hover{box-shadow:0 0 20px rgba(201,168,76,0.3);}
    .recent-chips{display:flex;flex-wrap:wrap;gap:0.5rem;margin-top:1rem;}
    .chip{
      padding:0.3rem 0.75rem;background:rgba(201,168,76,0.08);border:1px solid var(--border);
      border-radius:20px;color:var(--gold);font-size:0.78rem;cursor:pointer;transition:background 0.2s;min-height:44px;display:flex;align-items:center;}
    .chip:hover{background:rgba(201,168,76,0.18);}
    .chip-label{font-size:0.7rem;color:var(--muted);margin-bottom:0.4rem;}
    .back-link{color:var(--muted);font-size:0.82rem;text-decoration:none;display:block;text-align:center;margin-top:1.25rem;}
    .back-link:hover{color:var(--gold);}
    @media(max-width:480px){.card{padding:1.5rem 1rem;}}
  </style>
</head>
<body>
<div id="particles-js"></div>

<div class="card" id="track-card">
  <h1>Track Your Complaint</h1>
  <p>Enter your BK-XXXXX reference number to check the status of your complaint.</p>

  {% if error %}
  <div class="error-msg" id="error-msg">{{ error }}</div>
  {% endif %}

  <form method="post" id="track-form">
    {% csrf_token %}
    <div class="form-group">
      <input type="text" name="complaint_id" id="complaint-id" placeholder=" "
        value="{{ query|default:'' }}" maxlength="10" autocomplete="off" spellcheck="false"
        class="{% if error %}error-input{% endif %}">
      <label for="complaint-id">Complaint ID (BK-XXXXX)</label>
    </div>
    <button type="submit" class="btn-track">Track Status</button>
  </form>

  <div id="recent-section" style="display:none;">
    <p class="chip-label" style="margin-top:1rem;margin-bottom:0;">Recent</p>
    <div class="recent-chips" id="recent-chips"></div>
  </div>

  <a class="back-link" href="{% url 'complaints:complaint_submit' %}">← Submit a New Complaint</a>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
<script>
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (window.innerWidth >= 768 && typeof particlesJS !== 'undefined') {
    particlesJS('particles-js', {
      particles:{number:{value:25},color:{value:'#c9a84c'},opacity:{value:0.1,random:true},
        size:{value:2,random:true},move:{enable:true,speed:0.4,out_mode:'out'},
        line_linked:{enable:true,distance:100,color:'#c9a84c',opacity:0.05,width:1}},
      interactivity:{events:{onhover:{enable:false}}},retina_detect:true});
  }

  if (!prefersReducedMotion) {
    gsap.fromTo('#track-card',{y:40,opacity:0},{y:0,opacity:1,duration:0.5,ease:'power2.out'});
  }

  // Error shake
  {% if error %}
  if (!prefersReducedMotion) {
    gsap.fromTo('#track-card',{x:0},{x:8,duration:0.07,repeat:5,yoyo:true,ease:'none',clearProps:'x'});
  }
  {% endif %}

  // Auto-uppercase + auto-prefix BK-
  const cidInput = document.getElementById('complaint-id');
  cidInput.addEventListener('input', () => {
    let val = cidInput.value.toUpperCase().replace(/\s/g,'');
    if (val && !val.startsWith('BK-') && val.length <= 7) {
      val = 'BK-' + val.replace(/^BK-?/,'');
    }
    cidInput.value = val.slice(0, 8);
  });

  // localStorage recent IDs
  const STORAGE_KEY = 'bk_recent_ids';
  function getRecent() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { return []; }
  }

  const recent = getRecent();
  if (recent.length) {
    document.getElementById('recent-section').style.display = 'block';
    const chips = document.getElementById('recent-chips');
    recent.forEach(id => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip';
      chip.textContent = id;
      chip.onclick = () => { cidInput.value = id; };
      chips.appendChild(chip);
    });
  }

  // Save on submit
  document.getElementById('track-form').addEventListener('submit', () => {
    const val = cidInput.value.trim();
    if (val) {
      const recent = getRecent().filter(x => x !== val);
      recent.unshift(val);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(recent.slice(0, 3)));
    }
  });
</script>
</body>
</html>
